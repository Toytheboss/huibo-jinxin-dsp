<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>慧波 · 进芯 DSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b10;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --secondary: #cbd5e1;
      --accent: #3b82f6;
      --signal: #38bdf8;
      --border: #1e293b;
      --line: rgba(56, 189, 248, 0.45);
      --header-h: 64px;
      --pager-h: 56px;
      --toc-w: 196px;
      --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --display: "Exo", "Noto Sans SC", sans-serif;
      --mono: "Roboto Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; color-scheme: dark; }
    html { background: var(--bg); }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.65;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(880px 380px at 8% -8%, rgba(59, 130, 246, 0.22), transparent 62%),
        linear-gradient(rgba(56, 189, 248, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.045) 1px, transparent 1px);
      background-size: auto, 48px 48px, 48px 48px;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

    .skip {
      position: absolute;
      left: 12px;
      top: -48px;
      background: var(--accent);
      color: #020617;
      padding: 8px 12px;
      z-index: 40;
      font-weight: 700;
    }
    .skip:focus { top: 12px; }

    .top {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 18px;
      height: var(--header-h);
      padding: 0 22px;
      background: rgba(11, 11, 16, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--fg);
      text-decoration: none;
    }
    .mark {
      width: 34px;
      height: 34px;
      flex: none;
      border: 1px solid var(--signal);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .brand strong {
      display: block;
      font-family: var(--display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }
    .brand span {
      display: block;
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--signal);
    }
    .search {
      margin-left: auto;
      position: relative;
      width: min(340px, 40vw);
    }
    .search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .search input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      background: #0e1016;
      padding: 0 48px 0 38px;
    }
    .search input::placeholder { color: #64748b; }
    .search kbd {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid #334155;
      padding: 0 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
    }

    .toc {
      position: fixed;
      top: var(--header-h);
      left: 0;
      bottom: var(--pager-h);
      z-index: 20;
      width: var(--toc-w);
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 16px 10px;
      border-right: 1px solid var(--border);
      background: rgba(11, 11, 16, 0.55);
    }
    .toc a {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      min-height: 52px;
      padding: 8px 12px;
      color: var(--muted);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .toc a b { font-weight: 500; }
    .toc a small { font-size: 11px; letter-spacing: 0; opacity: 0.7; }
    .toc a:hover { color: var(--fg); background: rgba(59, 130, 246, 0.08); }
    .toc a[aria-current="true"] {
      color: #020617;
      background: var(--accent);
    }

    .stage {
      position: fixed;
      top: var(--header-h);
      left: var(--toc-w);
      right: 0;
      bottom: var(--pager-h);
      overflow: hidden;
      z-index: 1;
    }
    .rail {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #1e293b;
      z-index: 4;
    }
    .rail i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--signal);
      transition: width 480ms var(--ease);
    }
    .track {
      height: 100%;
      will-change: transform;
      transition: transform 520ms var(--ease);
    }
    html.reduce .track,
    html.reduce .rail i,
    html.reduce .slide-in { transition: none !important; animation: none !important; }

    .slide {
      height: 100%;
      padding: 28px 64px 20px 36px;
      overflow: auto;
      overscroll-behavior: contain;
    }
    .slide-in {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: rise 480ms var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(32px); }
      to { opacity: 1; transform: none; }
    }

    .idx {
      margin: 0 0 4px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--signal);
    }
    h2 {
      margin: 0 0 6px;
      font-family: var(--display);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }
    .job {
      margin: 0 0 18px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
    }
    .block-title {
      margin: 0 0 10px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--signal);
    }

    .plate {
      position: relative;
      background: rgba(20, 22, 28, 0.92);
      border: 1px solid var(--border);
    }
    .plate::before,
    .plate::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      pointer-events: none;
    }
    .plate::before {
      top: -1px;
      left: -1px;
      border-top: 1px solid var(--signal);
      border-left: 1px solid var(--signal);
    }
    .plate::after {
      right: -1px;
      bottom: -1px;
      border-right: 1px solid var(--signal);
      border-bottom: 1px solid var(--signal);
    }

    .script { padding: 18px 20px; }
    .script header, .supply-head, .reply header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.4; }
    .subj {
      margin: 6px 0 0;
      color: var(--signal);
      font-family: var(--mono);
      font-size: 12px;
    }
    .quote {
      margin: 14px 0 0;
      padding: 14px 16px;
      background: #0c0e14;
      border-left: 2px solid var(--accent);
      white-space: pre-wrap;
    }
    .aside {
      margin: 12px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
    }
    .tag, .pkg span {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border: 1px solid var(--border);
      color: var(--signal);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .script .tag { margin-bottom: 8px; }
    .pkg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    mark { background: rgba(59, 130, 246, 0.35); color: inherit; }

    .copy, .ghost, .edge, .pager button, .industries button, .grade, .product {
      border: 1px solid var(--border);
      background: #101218;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease;
    }
    .copy, .ghost {
      flex: none;
      min-height: 40px;
      padding: 0 14px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .copy:hover, .ghost:hover, .edge:hover, .pager button:hover,
    .industries button:hover, .grade:hover, .product:hover {
      border-color: var(--signal);
    }
    .copy.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #020617;
    }

    .reply { margin-top: 12px; padding: 18px; }
    .meta { margin: 6px 0 0; color: var(--muted); font-family: var(--mono); font-size: 12px; }
    details { margin-top: 10px; color: var(--secondary); font-size: 14px; }
    summary {
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--signal);
    }
    .ti {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--signal);
    }
    .ours {
      display: block;
      margin: 8px 0 6px;
      font-family: var(--display);
      font-weight: 700;
      font-size: 22px;
    }
    .kind { color: var(--secondary); }

    .card { padding: 18px; }
    .card p { margin: 0; color: var(--secondary); }
    .industries, .grades, .checks { display: flex; flex-direction: column; gap: 8px; }
    .industries button, .grade {
      text-align: left;
      min-height: 44px;
      padding: 12px 14px;
      width: 100%;
    }
    .industries b, .grade b { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--signal); }
    .industries small, .grade span { color: var(--secondary); }
    .grade { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; }
    .check {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(20, 22, 28, 0.92);
    }
    .check input { width: 16px; height: 16px; margin-top: 4px; accent-color: var(--accent); }
    .check.done span { color: var(--muted); text-decoration: line-through; }
    .visit-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .count { margin: 0; color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; }

    .empty {
      padding: 40px 16px;
      text-align: center;
      font-family: var(--mono);
      color: var(--signal);
    }

    .edge {
      position: absolute;
      top: 50%;
      z-index: 5;
      width: 44px;
      height: 44px;
      transform: translateY(-50%);
      color: var(--fg);
    }
    .edge[disabled] { opacity: 0.28; cursor: default; }
    #prev { left: 12px; }
    #next { right: 12px; }

    .pager {
      position: fixed;
      left: var(--toc-w);
      right: 0;
      bottom: 0;
      z-index: 20;
      height: var(--pager-h);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-top: 1px solid var(--line);
      background: rgba(11, 11, 16, 0.92);
      backdrop-filter: blur(14px);
    }
    .pager button {
      min-height: 36px;
      padding: 0 14px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .pager b {
      font-family: var(--mono);
      font-weight: 500;
      letter-spacing: 0.12em;
      min-width: 88px;
      text-align: center;
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 6;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--signal);
      pointer-events: none;
      opacity: 0;
      animation: hint 2.8s var(--ease) 0.4s both;
    }
    @keyframes hint {
      0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
      18% { opacity: 1; transform: translateX(-50%) translateY(0); }
      75% { opacity: 1; }
      100% { opacity: 0; }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%) translateY(8px);
      background: var(--accent);
      color: #020617;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 10px 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .manual {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 14, 0.72);
    }
    .manual[hidden] { display: none; }
    .manual .panel {
      width: min(520px, 100%);
      background: #10141c;
      border: 1px solid var(--line);
      padding: 18px;
    }
    .manual h3 {
      margin: 0 0 12px;
      font-family: var(--mono);
      letter-spacing: 0.14em;
      color: var(--signal);
    }
    .manual textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid var(--border);
      background: #0b0d12;
      padding: 12px;
      resize: vertical;
    }
    .manual .ghost { margin-top: 12px; }

    @media (max-width: 959px) {
      .toc {
        top: auto;
        bottom: var(--pager-h);
        left: 0;
        right: 0;
        width: auto;
        height: 56px;
        flex-direction: row;
        overflow-x: auto;
        padding: 0 8px;
        border-right: 0;
        border-top: 1px solid var(--border);
      }
      .toc a { flex: none; min-height: 56px; }
      .stage {
        left: 0;
        bottom: calc(var(--pager-h) + 56px);
      }
      .pager { left: 0; }
      .slide { padding: 20px 52px 16px 20px; }
      .grade { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .search { width: min(220px, 48vw); }
      .search kbd { display: none; }
      h2 { font-size: 26px; }
      .script header, .supply-head, .reply header { flex-direction: column; }
      .copy { width: 100%; }
      .edge { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media print {
      body { overflow: auto; background: #fff; color: #000; }
      body::before, .top, .toc, .pager, .edge, .hint, .toast, .manual, .rail { display: none !important; }
      .stage { position: static; }
      .track { transform: none !important; height: auto; }
      .slide { height: auto; overflow: visible; page-break-after: always; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#stage">跳到正文</a>
  <header class="top">
    <a class="brand" href="#outreach">
      <span class="mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <rect x="4" y="4" width="10" height="10" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
          <path d="M4 7H1M4 11H1M14 7h3M14 11h3M7 4V1M11 4V1M7 14v3M11 14v3" stroke="#3b82f6" stroke-width="1.2"/>
        </svg>
      </span>
      <div>
        <strong>慧波</strong>
        <span>进芯代理</span>
      </div>
    </a>
    <form class="search" role="search" onsubmit="return false">
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">搜索</label>
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
        <path d="M10.5 10.5L14 14" stroke="#64748b" stroke-width="1.4" stroke-linecap="square"/>
      </svg>
      <input id="q" type="search" placeholder="代理 / 28335 / 交期" autocomplete="off">
      <kbd>/</kbd>
    </form>
  </header>

  <nav class="toc" aria-label="目录">
    <a href="#outreach" data-jump="outreach"><b>01 拓客</b><small>你先开口</small></a>
    <a href="#reply" data-jump="reply"><b>02 回询盘</b><small>客户先开口</small></a>
    <a href="#products" data-jump="products"><b>03 对型号</b><small>他对哪颗 TI</small></a>
    <a href="#facts" data-jump="facts"><b>04 备查</b><small>证明 / 在供 / 分档</small></a>
    <a href="#visit" data-jump="visit"><b>05 见面</b><small>上门问这几句</small></a>
  </nav>

  <div class="stage" id="stage">
    <div class="rail" aria-hidden="true"><i id="rail"></i></div>
    <div class="track" id="track"></div>
    <button class="edge" id="prev" type="button" aria-label="上一页">↑</button>
    <button class="edge" id="next" type="button" aria-label="下一页">↓</button>
    <p class="hint">滚轮 · 下滑</p>
  </div>

  <div class="pager">
    <button type="button" id="prev2">上一页</button>
    <b id="pos">01 / 01</b>
    <button type="button" id="next2">下一页</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="manual" id="manual-copy" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="manual-title">
      <h3 id="manual-title">⌘C</h3>
      <textarea id="manual-copy-text" readonly></textarea>
      <button class="ghost" type="button" id="manual-close">关闭</button>
    </div>
  </div>

  <script>
    const products = [
      {
        id: "2812",
        ti: "TMS320F2812",
        ours: "ADP32F2812",
        kind: "32 位定点",
        packages: ["LQFP176", "BGA179", "CQFP176"],
        point: "硬件原位。软件按移植说明改几处。",
        reply: "2812 硬件原位，程序有几处按移植说明改。我把进芯的说明和手册发你，你先看时钟和 Flash。你们现在大概多少只，我跟厂家对交期。",
        spec: "已量产。工业级 LQFP176、BGA179，军品 CQFP176 陶封。"
      },
      {
        id: "335",
        ti: "TMS320F28335",
        ours: "ADP32F335 / JVP32F28335",
        kind: "32 位浮点",
        packages: ["LQFP176", "BGA176", "LQFP179", "CQFP176"],
        point: "硬件原位。烧录换 Flash API，片内 Flash 是华虹 IP。",
        reply: "28335 可以原位替，硬件按 F28335 来。软件侧主要是烧录：片内 Flash 要换成进芯的 API，CCS、C2Prog、UniFlash 都有替换说明，我发你。你是已有代码要切，还是新板？需要的话 DEMO 我跟厂家一起安排。",
        spec: "LQFP-176，主频 150MHz，256K×16 Flash，34K×16 RAM。ePWM、eCAN、SCI、SPI、I2C、ADC。"
      },
      {
        id: "035",
        ti: "TMS320F28035",
        ours: "ADP32F035 / JDP32F28035",
        kind: "32 位定点控制器",
        packages: ["QFP48", "QFP56", "QFP64", "QFP80", "QFN56"],
        point: "原位兼容。先对封装。",
        reply: "28035 按原位兼容来。封装有 48、56、64、80 脚，也有 QFN56。你原理图上是哪一种，我按那个发资料和 DEMO。",
        spec: "军品还有 CQFP80、CQFP64。"
      }
    ];

    const sign = "【姓名】\n南京慧波通信科技有限公司\n进芯科技官方认定代理\n【手机】";

    const outreachMails = [
      { tag: "第一次", title: "情况不明", keys: "拓客 开发 第一次 慧波 代理", subject: "进芯 DSP，对标 TI C2000", body: "你好，我是南京慧波通信的【姓名】。我们是进芯科技官方认定代理。\n\n进芯做对标 TI C2000 的 DSP。28335、2812、28035 硬件可以原位换。28335 烧录要换进芯的 Flash API，替换说明是现成的。\n\n你们板上如果有这几颗，或者新项目在选型，回我现在用的型号，我按那颗发手册。", note: "先报代理身份，三颗一起点名可以，别展开讲。" },

    const checks = [
      "现用的 TI 型号", "哪个部门在用 DSP", "新研有没有窗口", "老型号有没有国产化或降本",
      "时间节点", "这批数量和一年的量", "民用、工业宽温还是军品", "谁签字", "更在意认证、交期，还是代码工作量"
    ];
    const supplyLine = "我们是南京慧波通信，进芯科技官方认定代理。设计在进芯，流片华虹宏力，封测长电。国产化证明可以把这两家的供应商代码写进去，另外有承诺书。你项目要的是证明加承诺，还是还要五所的筛选报告？这两档交期和价格不一样，我分开跟厂家报。";

    const CHECK_KEY = "jinxin-dsp-visit-checks";
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (reduced.matches) document.documentElement.classList.add("reduce");
    reduced.addEventListener("change", () => {
      document.documentElement.classList.toggle("reduce", reduced.matches);
    });

    const q = document.getElementById("q");
    const toast = document.getElementById("toast");
    const track = document.getElementById("track");
    const stage = document.getElementById("stage");
    const rail = document.getElementById("rail");
    let slides = [];
    let index = 0;
    let locked = false;
    let wheelAcc = 0;
    let toastTimer = 0;
    let touchY = 0;
    let touchX = 0;
    let touching = false;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function highlight(text, query) {
      const safe = esc(text);
      const needle = query.trim();
      if (!needle) return safe;
      const pattern = esc(needle).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return safe.replace(new RegExp(pattern, "gi"), (m) => `<mark>${m}</mark>`);
    }
    function hay(item) {
      return `${item.tag || ""} ${item.title || ""} ${item.subject || ""} ${item.body || ""} ${item.note || ""} ${item.keys || ""} ${item.ti || ""} ${item.ours || ""} ${item.reply || ""}`.toLowerCase();
    }
    function pad(n) {
      return String(n).padStart(2, "0");
    }
    function mailText(item) {
      return `主题：${item.subject}\n\n${item.body}\n\n${sign}`;
    }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    }
    function copyText(text, button) {
      const done = () => {
        showToast("已复制");
        if (!button) return;
        const old = button.textContent;
        button.textContent = "已复制";
        button.classList.add("done");
        setTimeout(() => {
          button.textContent = old;
          button.classList.remove("done");
        }, 1400);
      };
      const manual = () => {
        const layer = document.getElementById("manual-copy");
        const area = document.getElementById("manual-copy-text");
        area.value = text;
        layer.hidden = false;
        area.focus();
        area.select();
      };
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.top = "0";
        document.body.appendChild(area);
        area.focus();
        area.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
        area.remove();
        if (ok) done();
        else manual();
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else {
        fallback();
      }
    }

    function matchItem(item, query) {
      return !query || hay(item).includes(query);
    }

    function buildSlides() {
      const query = q.value.trim().toLowerCase();
      const out = [];
      const addCards = (ch, idx, title, job, items, mail) => {
        const list = items.filter((item) => matchItem(item, query));
        list.forEach((item, i) => {
          out.push({
            ch, idx, title, job, mail, item,
            n: i + 1,
            total: list.length,
            kind: "card",
            copy: mail ? mailText(item) : item.body
          });
        });
      };
      addCards("outreach", "01", "拓客", "第一次邮件", outreachMails, true);
      addCards("outreach", "01", "拓客", "微信 / 电话", ice, false);
      addCards("reply", "02", "回询盘", "微信", scripts, false);
      addCards("reply", "02", "回询盘", "邮件", mails, true);

      const prod = products.filter((p) => matchItem(p, query) || "对型号 2812 28335 28035".includes(query));
      (query ? prod : products).forEach((p, i, arr) => {
        out.push({
          ch: "products", idx: "03", title: "对型号", job: "他对哪颗 TI",
          kind: "product", item: p, n: i + 1, total: arr.length, copy: p.reply
        });
      });

      const factHay = `供应链 华虹 长电 在供 分档 ${industries.map((x) => x.join(" ")).join(" ")} ${grades.map((x) => x.join(" ")).join(" ")}`.toLowerCase();
      if (!query || factHay.includes(query) || "备查 证明".includes(query)) {
        out.push({ ch: "facts", idx: "04", title: "备查", job: "供应链", kind: "supply", n: 1, total: 3, copy: supplyLine });
        out.push({ ch: "facts", idx: "04", title: "备查", job: "在供", kind: "industries", n: 2, total: 3, copy: "" });
        out.push({ ch: "facts", idx: "04", title: "备查", job: "分档", kind: "grades", n: 3, total: 3, copy: "" });
      }
      if (!query || "见面 上门 拜访".includes(query) || checks.some((c) => c.toLowerCase().includes(query))) {
        out.push({ ch: "visit", idx: "05", title: "见面", job: "上门问这几句", kind: "visit", n: 1, total: 1, copy: "" });
      }
      return out;
    }

    function cardHTML(s, query) {
      const item = s.item;
      return `
        <article class="script plate">
          <span class="tag">${esc(item.tag)}</span>
          <header>
            <div>
              <h3>${highlight(item.title, query)}</h3>
              ${item.subject ? `<p class="subj">主题：${highlight(item.subject, query)}</p>` : ""}
            </div>
            <button class="copy" type="button" data-copy>复制</button>
          </header>
          <p class="quote">${highlight(item.body, query)}${s.mail ? `\n\n${esc(sign)}` : ""}</p>
          ${item.note ? `<p class="aside">// ${highlight(item.note, query)}</p>` : ""}
        </article>`;
    }

    function productHTML(p, query) {
      return `
        <article class="reply plate">
          <header>
            <div>
              <span class="ti">${highlight(p.ti, query)}</span>
              <h3 class="ours">${highlight(p.ours, query)}</h3>
              <p class="meta">${esc(p.kind)}</p>
            </div>
            <button class="copy" type="button" data-copy>复制</button>
          </header>
          <p class="quote">${highlight(p.reply, query)}</p>
          <div class="pkg">${p.packages.map((x) => `<span>${esc(x)}</span>`).join("")}</div>
          <p class="aside">${esc(p.point)}</p>
          <details>
            <summary>参数</summary>
            <p>${esc(p.spec)}</p>
          </details>
        </article>`;
    }

    function visitHTML() {
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem(CHECK_KEY) || "[]"); } catch (err) { saved = []; }
      const set = new Set(Array.isArray(saved) ? saved : []);
      return `
        <div class="visit-bar">
          <p class="count" id="visit-count">${set.size} / ${checks.length}</p>
          <button class="ghost" type="button" id="clear-checks">清空</button>
        </div>
        <div class="checks" id="checks">
          ${checks.map((item, i) => `
            <label class="check${set.has(i) ? " done" : ""}">
              <input type="checkbox" data-i="${i}" ${set.has(i) ? "checked" : ""}>
              <span>${esc(item)}</span>
            </label>`).join("")}
        </div>`;
    }

    function renderTrack() {
      const query = q.value.trim();
      slides = buildSlides();
      if (!slides.length) {
        track.innerHTML = `<section class="slide"><div class="slide-in"><div class="empty plate">无匹配</div></div></section>`;
        index = 0;
        paint();
        return;
      }
      track.innerHTML = slides.map((s) => {
        let body = "";
        if (s.kind === "card") body = cardHTML(s, query);
        if (s.kind === "product") body = productHTML(s.item, query);
        if (s.kind === "supply") {
          body = `<article class="card plate">
            <div class="supply-head"><h3>代理 / 华虹 / 长电</h3><button class="copy" type="button" data-copy>复制</button></div>
            <p>我们是南京慧波通信，进芯科技官方认定代理。芯片进芯设计，流片华虹宏力，封测长电，筛选可走广州电子五所。国产化证明写得进这两家供应商代码，另有承诺书。进芯 2012 年成立，2016 年进工控，2019 年进军工。资料样品交期我们对接，厂家技术当天线上响应，现场 7 天内。</p>
          </article>`;
        }
        if (s.kind === "industries") {
          body = `<div class="industries">${industries.map(([name, line], i) => `
            <button type="button" data-line="${i}"><b>${esc(name)}</b><small>${esc(line)}</small></button>`).join("")}</div>`;
        }
        if (s.kind === "grades") {
          body = `<div class="grades">${grades.map(([name, line], i) => `
            <button class="grade" type="button" data-grade="${i}"><b>${esc(name)}</b><span>${esc(line)}</span></button>`).join("")}</div>`;
        }
        if (s.kind === "visit") body = visitHTML();
        return `<section class="slide" data-ch="${s.ch}">
          <div class="slide-in">
            <p class="idx">${s.idx} · ${pad(s.n)} / ${pad(s.total)}</p>
            <h2>${esc(s.title)}</h2>
            <p class="job">${esc(s.job)}</p>
            ${body}
          </div>
        </section>`;
      }).join("");
      bindSlideExtras();
      if (index > slides.length - 1) index = 0;
      paint(true);
    }

    function bindSlideExtras() {
      track.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slide = btn.closest(".slide");
          const i = [...track.children].indexOf(slide);
          if (slides[i] && slides[i].copy) copyText(slides[i].copy, btn);
        });
      });
      track.querySelectorAll("[data-line]").forEach((btn) => {
        btn.addEventListener("click", () => copyText(industries[Number(btn.dataset.line)][1], null));
      });
      track.querySelectorAll("[data-grade]").forEach((btn) => {
        btn.addEventListener("click", () => copyText(grades[Number(btn.dataset.grade)][1], null));
      });
      const list = track.querySelector("#checks");
      if (!list) return;
      const updateCount = () => {
        const n = list.querySelectorAll("input:checked").length;
        const el = document.getElementById("visit-count");
        if (el) el.textContent = `${n} / ${checks.length}`;
      };
      list.querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          input.closest(".check").classList.toggle("done", input.checked);
          const next = [];
          list.querySelectorAll("input").forEach((box) => {
            if (box.checked) next.push(Number(box.dataset.i));
          });
          localStorage.setItem(CHECK_KEY, JSON.stringify(next));
          updateCount();
        });
      });
      const clear = track.querySelector("#clear-checks");
      if (clear) {
        clear.addEventListener("click", () => {
          localStorage.removeItem(CHECK_KEY);
          renderTrack();
        });
      }
    }

    function paint(resetEnter) {
      const n = Math.max(slides.length, 1);
      track.style.transform = `translate3d(0, ${-index * 100}%, 0)`;
      rail.style.width = `${((index + 1) / n) * 100}%`;
      document.getElementById("pos").textContent = `${pad(index + 1)} / ${pad(n)}`;
      const atStart = index <= 0;
      const atEnd = index >= n - 1;
      ["prev", "prev2"].forEach((id) => { document.getElementById(id).disabled = atStart; });
      ["next", "next2"].forEach((id) => { document.getElementById(id).disabled = atEnd; });
      const ch = slides[index] ? slides[index].ch : "";
      document.querySelectorAll(".toc a").forEach((a) => {
        if (a.dataset.jump === ch) a.setAttribute("aria-current", "true");
        else a.removeAttribute("aria-current");
      });
      if (ch) history.replaceState(null, "", `#${ch}`);
      if (resetEnter) {
        const node = track.children[index];
        if (!node) return;
        const inner = node.querySelector(".slide-in");
        if (!inner || reduced.matches) return;
        inner.style.animation = "none";
        void inner.offsetWidth;
        inner.style.animation = "";
      }
    }

    function go(to) {
      if (!slides.length) return;
      const next = Math.max(0, Math.min(slides.length - 1, to));
      if (next === index || locked) return;
      locked = true;
      index = next;
      const node = track.children[index];
      if (node) node.scrollTop = 0;
      paint(true);
      const wait = reduced.matches ? 0 : 520;
      setTimeout(() => { locked = false; }, wait);
    }
    function step(dir) { go(index + dir); }

    function currentSlideEl() {
      return track.children[index];
    }
    function atEdge(dir) {
      const el = currentSlideEl();
      if (!el) return true;
      if (dir > 0) return el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
      return el.scrollTop <= 2;
    }

    document.getElementById("prev").addEventListener("click", () => step(-1));
    document.getElementById("next").addEventListener("click", () => step(1));
    document.getElementById("prev2").addEventListener("click", () => step(-1));
    document.getElementById("next2").addEventListener("click", () => step(1));

    document.querySelectorAll(".toc a").forEach((a) => {
      a.addEventListener("click", (event) => {
        event.preventDefault();
        const i = slides.findIndex((s) => s.ch === a.dataset.jump);
        if (i >= 0) go(i);
      });
    });

    stage.addEventListener("wheel", (event) => {
      if (Math.abs(event.deltaY) < Math.abs(event.deltaX)) return;
      const dir = event.deltaY > 0 ? 1 : -1;
      if (!atEdge(dir)) return;
      event.preventDefault();
      wheelAcc += event.deltaY;
      if (Math.abs(wheelAcc) < 70) return;
      step(dir);
      wheelAcc = 0;
    }, { passive: false });

    stage.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button, a, input, textarea, label, details")) return;
      touching = true;
      touchY = event.clientY;
      touchX = event.clientX;
    });
    stage.addEventListener("pointerup", (event) => {
      if (!touching) return;
      touching = false;
      const dy = event.clientY - touchY;
      const dx = event.clientX - touchX;
      if (Math.abs(dy) < 48 && Math.abs(dx) < 48) return;
      if (Math.abs(dy) >= Math.abs(dx)) {
        const dir = dy < 0 ? 1 : -1;
        if (atEdge(dir)) step(dir);
      } else {
        step(dx < 0 ? 1 : -1);
      }
    });
    stage.addEventListener("pointercancel", () => { touching = false; });

    document.addEventListener("keydown", (event) => {
      const manualOpen = !document.getElementById("manual-copy").hidden;
      if (event.key === "Escape" && manualOpen) {
        document.getElementById("manual-copy").hidden = true;
        return;
      }
      const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
      if (event.key === "/" && !typing) {
        event.preventDefault();
        q.focus();
        q.select();
        return;
      }
      if (event.key === "Escape" && document.activeElement === q) {
        q.value = "";
        index = 0;
        renderTrack();
        q.blur();
        return;
      }
      if (typing || manualOpen) return;
      if (["ArrowDown", "PageDown", "j", " "].includes(event.key)) {
        event.preventDefault();
        step(1);
      }
      if (["ArrowUp", "PageUp", "k"].includes(event.key)) {
        event.preventDefault();
        step(-1);
      }
      if (event.key === "Home") { event.preventDefault(); go(0); }
      if (event.key === "End") { event.preventDefault(); go(slides.length - 1); }
    });

    q.addEventListener("input", () => {
      index = 0;
      renderTrack();
    });
    document.getElementById("manual-close").addEventListener("click", () => {
      document.getElementById("manual-copy").hidden = true;
    });
    document.getElementById("manual-copy").addEventListener("click", (event) => {
      if (event.target.id === "manual-copy") event.currentTarget.hidden = true;
    });

    renderTrack();
    const hash = location.hash.replace("#", "");
    const start = slides.findIndex((s) => s.ch === hash);
    if (start > 0) go(start);
  </script>
</body>
</html>
